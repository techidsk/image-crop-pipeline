# nginx Basic Auth 占位文件
#
# 默认不启用任何鉴权。要启用 Basic Auth：
#   1. 在宿主机上生成密码文件：htpasswd -B -c .htpasswd <username>
#   2. 在 docker-compose.yml 的 frontend.volumes 加：
#        - ./nginx/auth.enabled.conf:/etc/nginx/auth.conf:ro
#        - ./.htpasswd:/etc/nginx/.htpasswd:ro
#   3. 新建 nginx/auth.enabled.conf 内容：
#        auth_basic "Restricted";
#        auth_basic_user_file /etc/nginx/.htpasswd;
#   4. docker compose up -d --force-recreate frontend
